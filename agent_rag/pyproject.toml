[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-rag"
version = "0.1.0"
description = "A standalone Agent RAG component with Chat and Deep Research capabilities"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Onyx Team" }
]
keywords = ["rag", "agent", "llm", "search", "vespa", "deep-research"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "litellm>=1.40.0",
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
    "tiktoken>=0.5.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
vespa = [
    "pyvespa>=0.45.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]
all = [
    "agent-rag[vespa,dev]",
]

[project.urls]
Homepage = "https://github.com/onyx-dot-app/onyx"
Documentation = "https://docs.onyx.app"
Repository = "https://github.com/onyx-dot-app/onyx"

[tool.hatch.build.targets.wheel]
packages = ["agent_rag"]

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 88
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
